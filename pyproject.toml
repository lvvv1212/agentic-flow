[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-flow"
version = "0.1.0"
description = "A lightweight, modular framework for building AI agents with tool use, planning, and multi-agent orchestration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "agentic-flow contributors" },
]
keywords = ["ai", "agents", "llm", "tools", "orchestration", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "tiktoken>=0.5",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/your-org/agentic-flow"
Repository = "https://github.com/your-org/agentic-flow"
Issues = "https://github.com/your-org/agentic-flow/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
